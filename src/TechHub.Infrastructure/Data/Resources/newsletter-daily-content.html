{{#if hasItems}}
{{#each sections}}
<h3 class="th-section-heading"{{#if @first}} style="margin-top: 8px;"{{/if}}>{{title}}</h3>
<ul class="th-item-list">
  {{#each items}}
  <li class="th-item">
    <a href="{{url}}" class="th-link" style="color:#6535c7;text-decoration:none;font-weight:500;">{{title}}</a>
    <span class="th-muted">({{collectionName}})</span>
  </li>
  {{/each}}
</ul>
{{/each}}
{{else}}
<p class="th-no-items" style="margin-top: 8px; color: #666;">No new content items for today.</p>
{{/if}}
{{{footer}}}
